name: CI Contracts Validation

on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/ci-contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/ci-contracts.yml'

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: contracts/requirements-validation.txt
      - name: Install pinned validation tools
        run: |
          npm ci --prefix contracts
          python -m pip install --disable-pip-version-check -r contracts/requirements-validation.txt
      - name: Validate OpenAPI 3.1 contracts
        run: >-
          npm --prefix contracts exec -- redocly lint
          contracts/openapi/users.json
          contracts/openapi/catalog.json
          contracts/openapi/notifications.json
      - name: Validate JSON Schema and contract behavior
        run: python -m unittest discover -s contracts/tests -p 'test_*.py' -v
