name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full SHA of the approved main commit
        required: true
        type: string
      apim_compatible:
        description: APIM compatibility has been verified for this commit
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate_build_job:
    runs-on: ubuntu-latest
    name: Validate Angular Build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Create validation environment
        working-directory: ./app/frontend
        run: |
          mkdir -p src/environments

          node - <<'NODE'
          const fs = require('fs');

          const environment = {
            apiBaseUrl: 'https://example.invalid',
            googleClientId: 'ci-placeholder'
          };

          fs.writeFileSync(
            'src/environments/environment.ts',
            `export const environment = ${JSON.stringify(environment, null, 2)};\n`
          );
          NODE

      - name: Install dependencies
        working-directory: ./app/frontend
        run: npm ci

      - name: Test Angular application
        working-directory: ./app/frontend
        run: npm test -- --watch=false

      - name: Test same-origin API proxy
        working-directory: ./app/frontend/api
        run: npm test

      - name: Build Angular application
        working-directory: ./app/frontend
        run: npm run build

      - name: Verify production artifact
        run: |
          test -f app/frontend/dist/market-tec-frontend/browser/index.html
          test -f app/frontend/dist/market-tec-frontend/browser/staticwebapp.config.json
          if grep -R -E -q 'Ocp-Apim-Subscription-Key|subscriptionKey|MARKET_TEC_SUBSCRIPTION_KEY' app/frontend/dist/market-tec-frontend/browser; then
            echo 'APIM subscription key reference found in public artifact' >&2
            exit 1
          fi

  deploy_job:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.apim_compatible == true &&
      inputs.approved_sha == github.sha &&
      vars.MTEC41_SWA_DEPLOY_ENABLED == 'true'
    needs: validate_build_job
    runs-on: ubuntu-latest
    name: Deploy approved main commit
    environment: swa-production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Create Angular environment
        working-directory: ./app/frontend
        shell: bash
        env:
          MARKET_TEC_API_URL: ${{ secrets.MARKET_TEC_API_URL }}
          MARKET_TEC_GOOGLE_CLIENT_ID: ${{ secrets.MARKET_TEC_GOOGLE_CLIENT_ID }}
          MARKET_TEC_AUTH_CORE_V2: ${{ vars.MARKET_TEC_AUTH_CORE_V2 }}
          MARKET_TEC_CATALOG_MODE: ${{ vars.MARKET_TEC_CATALOG_MODE }}
          MARKET_TEC_CATALOG_API_URL: ${{ vars.MARKET_TEC_CATALOG_API_URL }}
          MARKET_TEC_PASSWORD_AUTH: ${{ vars.MARKET_TEC_PASSWORD_AUTH }}
          MARKET_TEC_EMAIL_LINK_AUTH: ${{ vars.MARKET_TEC_EMAIL_LINK_AUTH }}
        run: |
          test -n "$MARKET_TEC_API_URL"
          test -n "$MARKET_TEC_GOOGLE_CLIENT_ID"

          mkdir -p src/environments

          node - <<'NODE'
          const fs = require('fs');

          const environment = {
            apiBaseUrl: process.env.MARKET_TEC_API_URL,
            googleClientId: process.env.MARKET_TEC_GOOGLE_CLIENT_ID
          };

          function flag(name, fallback) {
            const value = process.env[name];
            if (!value && fallback !== undefined) return fallback;
            if (value !== 'true' && value !== 'false') throw new Error(`Invalid boolean: ${name}`);
            return value === 'true';
          }

          const authCoreV2 = flag('MARKET_TEC_AUTH_CORE_V2', false);
          const mode = process.env.MARKET_TEC_CATALOG_MODE;
          const catalogBase = process.env.MARKET_TEC_CATALOG_API_URL;
          const usersUrl = new URL(environment.apiBaseUrl);
          if (/^\/api\/users(?:\/|$)/.test(usersUrl.pathname) && !authCoreV2) {
            throw new Error('The ms-users proxy requires MARKET_TEC_AUTH_CORE_V2=true and an explicit catalog destination');
          }
          if (authCoreV2 || mode || catalogBase) {
            if (!authCoreV2 || !['legacy-google', 'internal-jwt'].includes(mode) || !catalogBase) {
              throw new Error('Auth Core V2 requires an explicit catalog mode and proxy URL');
            }
            const catalogUrl = new URL(catalogBase);
            const proxyPath = mode === 'internal-jwt' ? '/api/catalog-v2/v1' : '/api/catalog/v1';
            if (usersUrl.protocol !== 'https:' || catalogUrl.origin !== usersUrl.origin ||
                catalogUrl.href !== usersUrl.origin + proxyPath) {
              throw new Error(`Expected the same-origin HTTPS catalog proxy at ${proxyPath}`);
            }
            environment.catalogApiBaseUrl = catalogUrl.href;
            environment.featureFlags = {
              authCoreV2,
              authCoreV2Adapter: 'http',
              authCoreV2HttpTopologyVerified: true,
              catalogInternalJwt: mode === 'internal-jwt',
              passwordAuth: flag('MARKET_TEC_PASSWORD_AUTH'),
              emailLinkAuth: flag('MARKET_TEC_EMAIL_LINK_AUTH')
            };
          }

          fs.writeFileSync(
            'src/environments/environment.ts',
            `export const environment = ${JSON.stringify(environment, null, 2)};\n`
          );
          NODE

      - name: Install dependencies
        working-directory: ./app/frontend
        run: npm ci

      - name: Build Angular application
        working-directory: ./app/frontend
        run: npm run build

      - name: Verify production artifact
        run: |
          test -f app/frontend/dist/market-tec-frontend/browser/index.html
          test -f app/frontend/dist/market-tec-frontend/browser/staticwebapp.config.json
          if grep -R -E -q 'Ocp-Apim-Subscription-Key|subscriptionKey|MARKET_TEC_SUBSCRIPTION_KEY' app/frontend/dist/market-tec-frontend/browser; then
            echo 'APIM subscription key reference found in public artifact' >&2
            exit 1
          fi

      - name: Deploy prebuilt artifact
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_BEACH_0A55F0C1E }}
          action: "upload"
          app_location: "./app/frontend/dist/market-tec-frontend/browser"
          api_location: "./app/frontend/api"
          output_location: ""
          skip_app_build: true
