name: CI ms-notifications

on:
  push:
    paths:
      - 'app/ms-notifications/**'
      - '.github/workflows/ci-ms-notifications.yml'
  pull_request:
    paths:
      - 'app/ms-notifications/**'
      - '.github/workflows/ci-ms-notifications.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ms-notifications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            app/ms-notifications/pyproject.toml
            app/ms-notifications/requirements-dev.lock
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Import application and run tests
        run: |
          python -c "from markettec_notifications.main import app; assert app.title"
          python -m pytest
