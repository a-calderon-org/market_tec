name: CI ms-catalog

on:
  push:
    paths:
      - 'app/ms-catalog/**'
      - '.nvmrc'
      - '.github/workflows/ci-ms-catalog.yml'
  pull_request:
    paths:
      - 'app/ms-catalog/**'
      - '.nvmrc'
      - '.github/workflows/ci-ms-catalog.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ms-catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: app/ms-catalog/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, build and test
        run: npm run check
