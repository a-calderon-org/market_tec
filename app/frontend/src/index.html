<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <script
      src="https://accounts.google.com/gsi/client"
      async
      defer>
    </script>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('market-tec-theme'); } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>MarketTEC</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Marca oficial de MarketTEC (la misma del encabezado). `?v=` evita que el navegador conserve el logo anterior. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
